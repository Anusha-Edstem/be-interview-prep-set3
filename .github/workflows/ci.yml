name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^Q[1-5] \| .+$'; then
            echo "PR title must match ^Q[1-5] \| .+$"
            exit 1
          fi

      - name: Spotless
        run: ./mvnw -B -q spotless:check

      - name: Verify
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "20"

      - name: Comment check
        if: github.event_name == 'pull_request'
        run: node .claude/hooks/check-added-comments.cjs "origin/${{ github.base_ref }}"
