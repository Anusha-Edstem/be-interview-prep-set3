spring:
  application:
    name: be-interview-prep
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  error:
    include-stacktrace: never
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
booking:
  slot-length: 30m
  hold-duration: 5m
  day-start: "09:00"
  day-end: "17:00"
  zone: UTC
  expiry-sweep-interval: 30s
