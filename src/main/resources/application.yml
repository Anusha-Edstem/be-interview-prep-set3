spring:
  application:
    name: be-interview-prep
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
server:
  error:
    include-stacktrace: never
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
booking:
  slot-length: 30m
  hold-duration: 5m
  day-start: "09:00"
  day-end: "17:00"
  zone: UTC
  expiry-sweep-interval: 30s
rate-limit:
  max-requests: 10
  window: 1m
  paths:
    - /api/v1/quotes/**
file-storage:
  location: ./storage
  max-file-size: 5MB
