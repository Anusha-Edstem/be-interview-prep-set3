spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
management:
  endpoints:
    web:
      exposure:
        include: health
rate-limit:
  max-requests: 10
  window: 1m
  paths:
    - /api/v1/quotes/**
file-storage:
  location: ${java.io.tmpdir}/be-interview-prep-test/storage
  max-file-size: 5MB
